<div class="col-6 col-md-4 col-lg-3">
  <div class="card h-100">
    {% if product.thumbnail %}
    <img src="{{ product.thumbnail.url }}" class="card-img-top" alt="{{ product.title }}">
    {% else %}
    <div class="card-img-top d-flex align-items-center justify-content-center bg-light">
      <i class="bi bi-image text-muted" style="font-size: 3rem;"></i>
    </div>
    {% endif %}
    <div class="card-body d-flex flex-column">
      <div class="mb-1">
        <span class="badge bg-light text-dark category-badge">{{ product.category.title|title }}</span>
      </div>
      <h6 class="card-title mb-1"><a href="{% url 'product-details' product.slug %}" class="text-decoration-none text-dark">{{ product.title|truncatewords:8 }}</a></h6>
      <div class="d-flex justify-content-between align-items-center mt-auto">
        <span class="fw-bold text-primary">${{ product.price|floatformat:"2" }}</span>
        {% if product.in_stock %}
        <form action="{% url 'add-to-cart' product.id %}" method="post" class="d-inline">
          {% csrf_token %}
          <button type="submit" class="btn btn-sm btn-outline-primary">Add</button>
        </form>
        {% else %}
        <span class="badge bg-secondary">Out of Stock</span>
        {% endif %}
      </div>
    </div>
  </div>
</div>
