{% extends 'base.html' %}
{% load static %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card">
      <div class="card-body p-4">
        <h3 class="h5 mb-1">Reset Password</h3>
        <p class="text-muted small mb-4">Enter your email to receive a password reset link</p>

        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label small">Email</label>
            <input name="email" type="email" class="form-control form-control-sm" required>
            {% if form.email.errors %}
            <div class="text-danger small mt-1">{{ form.email.errors }}</div>
            {% endif %}
          </div>
          <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
        </form>

        <hr class="my-3">
        <p class="text-center text-muted small mb-0">
          <a href="{% url 'login' %}" class="text-decoration-none">Back to login</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
