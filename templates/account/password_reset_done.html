{% extends 'base.html' %}
{% load static %}
{% block title %}Password Reset Sent{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card">
      <div class="card-body p-4 text-center">
        <i class="bi bi-envelope-check-fill text-success" style="font-size: 3rem;"></i>
        <h3 class="h5 mt-3 mb-1">Check your email</h3>
        <p class="text-muted small">We've sent password reset instructions to your email address.</p>
        <p class="text-muted small">If you don't see it, check your spam folder.</p>
        <a href="{% url 'login' %}" class="btn btn-primary mt-3">Back to Login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
